<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAR Card EF MX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: tablero de control — resumen arriba, filtros por oficina, rejilla de tarjetas físicas; panel lateral por persona */
:root{
  --bg:#E4F0FB; --surface:#FFFFFF; --sunk:#D5E6F6; --ink:#16213A; --muted:#55657A; --line:#C9DCEE;
  --navy:#003A63; --pink:#E23F8B; --lav:#9C7FDD;
  --ok:#1D8A5B; --okbg:#E3F4EC; --warn:#A8620B; --warnbg:#FBEFDC;
  --card-a:#A78BE0; --card-b:#DE7CC0; --card-c:#FA92AF; --card-ink:#0B2B4A; --slot:#FFFFFF;
  --f-display:"Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1826; --surface:#132336; --sunk:#1A2D44; --ink:#EEF3FA; --muted:#9FB0C6; --line:#243A53;
  --navy:#8CC0EC; --pink:#FF73B1; --lav:#B9A2F2;
  --ok:#5ED3A0; --okbg:#173126; --warn:#F2B55E; --warnbg:#35270F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1826; --surface:#132336; --sunk:#1A2D44; --ink:#EEF3FA; --muted:#9FB0C6; --line:#243A53;
  --navy:#8CC0EC; --pink:#FF73B1; --lav:#B9A2F2;
  --ok:#5ED3A0; --okbg:#173126; --warn:#F2B55E; --warnbg:#35270F; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.bg-globi{position:fixed;right:-90px;bottom:-110px;width:min(560px,70vw);aspect-ratio:1;pointer-events:none;z-index:0;opacity:.16;transform:rotate(-12deg)}
.bg-globi.two{right:auto;left:-140px;bottom:auto;top:18%;width:min(300px,45vw);opacity:.09;transform:rotate(14deg)}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--pink)}
.status{font-size:13px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:12.5px}
.stat.alert b{color:var(--warn)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child{grid-column:span 2}}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1 1 200px;min-width:0;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
select.sel{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}

.group{margin-bottom:26px}
.group h2{font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.group h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}

/* La tarjeta física: réplica de la RAR Card de Canva */
:root{--rc-bg:#F7D3DC; --rc-swoosh:#F1C2CE; --rc-pink:#FF329B; --rc-ink:#2B1621}
.gcard{position:relative;border:0;text-align:left;padding:14px 14px 10px;border-radius:14px;color:var(--rc-ink);background:var(--rc-bg);
  box-shadow:0 8px 22px -14px rgba(160,30,90,.6);overflow:hidden;width:100%;transition:transform .15s;isolation:isolate}
.gcard::before{content:"";position:absolute;z-index:-1;left:-18%;top:-40%;width:70%;height:180%;border-radius:50%;border:38px solid var(--rc-swoosh);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(18deg)}
.gcard:hover{transform:translateY(-2px)}
.gcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.gcard .brand{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:.9;letter-spacing:-.055em;color:var(--rc-pink)}
.gcard .nm{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.15;margin-top:6px}
.gcard .sub{font-size:11.5px;opacity:.7;font-weight:600}
.gcard .logo{width:54px;height:auto;flex:none}
.gcard .tag{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rc-pink);border:1.5px solid var(--rc-pink);padding:1px 7px;border-radius:999px;white-space:nowrap}
.gcard .rt{text-align:right}
.rows{display:grid;gap:2px}
.row{display:grid;grid-template-columns:78px repeat(6,1fr);gap:2px;align-items:center}
.row .lbl{margin-left:-14px;background:var(--rc-pink);color:#fff;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:0 999px 999px 0;padding:5px 6px 5px 10px;text-align:center}
.slot{aspect-ratio:1;max-width:100%;display:block}
.slot svg{width:100%;height:100%;display:block;overflow:visible}
.slot.on svg{animation:none}
.slot.new svg{animation:pop .6s ease-out}
.slot{position:relative}
.slot.canj svg{opacity:.55}
.slot.canj::after{content:"CANJEADO";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);font-family:var(--f-display);font-weight:800;font-size:clamp(6px,1.9vw,9px);letter-spacing:.02em;color:#fff;background:#003A63;padding:1px 3px;border-radius:3px;white-space:nowrap;pointer-events:none}
.gcard.big .slot.canj::after{font-size:clamp(7px,2.2vw,11px)}
.slot.due{border-radius:50%;box-shadow:0 0 0 3px #F5A524}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:5px}
.redeem{font-weight:700;white-space:nowrap}
.redeem .ok{color:#0B5A3A}
.redeem .due{color:#9A5B00}
.ptype{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap;background:var(--sunk);color:var(--navy)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.gcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:11.5px;font-weight:600;gap:8px}
.gcard .foot .fine{font-weight:500;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gcard .num{font-variant-numeric:tabular-nums;color:var(--rc-pink);font-weight:800;white-space:nowrap}
.gcard.big{padding:20px 20px 14px}
.gcard.big .brand{font-size:44px}
.gcard.big .logo{width:78px}
.gcard.big .nm{font-size:19px}
.gcard.big .row{grid-template-columns:100px repeat(6,1fr);gap:6px}
.gcard.big .row .lbl{margin-left:-20px;font-size:11px;padding:7px 8px 7px 14px}
.gcard.big .foot{font-size:13px}
@media (prefers-reduced-motion:reduce){.slot.new svg{animation:none}}

/* Panel lateral */
aside.side{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:980px){aside.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:10px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.rank .pos{font-family:var(--f-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .who small{color:var(--muted)}
.rank b{font-variant-numeric:tabular-nums}
.cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--sunk);border-radius:8px;padding:8px 10px;margin:6px 0;display:block;overflow-x:auto}
.note{font-size:13px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:31;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) 18px;
  box-shadow:-10px 0 40px -20px rgba(0,0,0,.5);display:grid;gap:16px;align-content:start}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.cards2{display:grid;gap:10px}
.cards2 .cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.addbox{display:grid;gap:10px}
.addbox .line{display:flex;gap:8px;flex-wrap:wrap}
.addbox input{flex:1 1 160px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vbtn{flex:1 1 110px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700}
.vbtn:hover{border-color:var(--pink)}
.miles{display:grid;gap:6px}
.mile{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.mile .req{font-size:12px;color:var(--muted)}
.mile.won{border-color:var(--ok)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:0}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.off{background:var(--sunk);color:var(--muted)}
button.pill{cursor:pointer}
.hist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px}
.vchip{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--sunk);color:var(--navy)}
.hrow .meta{font-size:12px;color:var(--muted)}
.hrow .prize{font-weight:600;overflow-wrap:anywhere}
.hact{display:flex;gap:6px;align-items:center}
.del{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}
.danger{color:var(--pink)}

/* Premios */
.prow{display:grid;grid-template-columns:minmax(0,1fr) 52px auto auto;gap:6px;align-items:center;margin-bottom:6px}
.prow input[type=text],.prow input[type=number]{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.prow label{font-size:12px;color:var(--muted);display:flex;gap:3px;align-items:center}
.form2{display:grid;gap:8px}
.form2 input,.form2 select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:100%}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:15px}
details[open] summary{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:50;font-size:14px}
</style>
</head><body>

<svg class="bg-globi" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#FF329B"/><g stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity=".55"><path d="M4 50h92M50 4c-20 14-20 78 0 92M50 4c20 14 20 78 0 92M10 28h80M10 72h80"/></g><ellipse cx="38" cy="43" rx="6" ry="7.5" fill="#FFFFFF"/><ellipse cx="62" cy="43" rx="6" ry="7.5" fill="#FFFFFF"/><path d="M33 60c9 11 25 11 34 0" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/></svg>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Competencia RAR Q1 · octubre a diciembre</div>
      <h1>RAR Card <span>EF MX</span></h1>
    </div>
    <div class="status" id="status">Conectando…</div>
  </header>

  <section class="stats" aria-label="Resumen">
    <div class="stat"><b id="sPeople">–</b><small>Participantes</small></div>
    <div class="stat"><b id="sStamps">–</b><small>Sellos totales</small></div>
    <div class="stat"><b id="sCards">–</b><small>Tarjetas completas</small></div>
    <div class="stat"><b id="sMiles">–</b><small>Premios de meta ganados</small></div>
    <div class="stat"><b id="sActive">–</b><small>Con al menos 1 sello</small></div>
  </section>

  <div class="toolbar">
    <div class="seg" id="officeSeg" role="group" aria-label="Oficina"></div>
    <input id="q" class="search" type="search" placeholder="Buscar especialista">
    <select id="sort" class="sel" aria-label="Ordenar">
      <option value="stamps">Más sellos primero</option>
      <option value="name">Por nombre</option>
    </select>
  </div>

  <div class="layout">
    <main id="board"><div class="empty">Cargando tarjetas…</div></main>
    <aside class="side">
      <div class="panel">
        <h3>Top 5 nacional</h3>
        <ol class="rank" id="rank"></ol>
      </div>
    </aside>
  </div>
</div>

function slotSVG(v,on){
  const ring=Array(v.n).fill(v.w).join("  ")+"  ";
  const P="#FF329B";
  const g=on
   ?`<circle cx="50" cy="50" r="21" fill="${P}"/><g stroke="#FFC2E0" stroke-width="1.6" fill="none"><path d="M29 50h42M50 29c-9 7-9 35 0 42M50 29c9 7 9 35 0 42M33 39h34M33 61h34"/></g><ellipse cx="44" cy="46" rx="3" ry="3.4" fill="#fff"/><ellipse cx="56" cy="46" rx="3" ry="3.4" fill="#fff"/><path d="M42.5 53.5c4 4.5 11 4.5 15 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
   :`<g stroke="${P}" stroke-width="1.5" fill="none"><circle cx="50" cy="50" r="21"/><path d="M29 50h42M50 29c-9 7-9 35 0 42M50 29c9 7 9 35 0 42M33 39h34M33 61h34"/></g><ellipse cx="44" cy="46" rx="3" ry="3.4" fill="${P}"/><ellipse cx="56" cy="46" rx="3" ry="3.4" fill="${P}"/><path d="M42.5 53.5c4 4.5 11 4.5 15 0" stroke="${P}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><text font-size="10.5" font-family="Figtree,sans-serif" font-weight="500" fill="#2B1621"><textPath href="#ringPath" textLength="257" lengthAdjust="spacing">${ring}</textPath></text><circle cx="50" cy="50" r="30" fill="#fff"/>${g}</svg>`;
}

function calc(pid){
  const list=S.stamps.filter(s=>s.pid===pid).sort((a,b)=>(a.at||"").localeCompare(b.at||""));
  const c1={},c2={},seen={},idx={};VERTS.forEach(v=>{c1[v.k]=0;c2[v.k]=0;seen[v.k]=0;idx[v.k]=[]});
  let extra=0;
  list.forEach((s,k)=>{const v=s.vertical;if(!(v in seen))return;idx[v].push(k);const n=seen[v]++;if(n<6)c1[v]++;else if(n<12)c2[v]++;else extra++});
  const t1=Object.values(c1).reduce((a,b)=>a+b,0),t2=Object.values(c2).reduce((a,b)=>a+b,0);
  return {list,c1,c2,t1,t2,extra,idx,total:list.length};
}
const isRespin=s=>/vuelve a girar/i.test(s.prize||"");
function spinsOf(pid){return S.spins.filter(s=>s.pid===pid).sort((a,b)=>(a.at||"").localeCompare(b.at||""))}
const perStamp=pid=>{const p=S.people.get(pid)||{};return (p.app||p.group==="APP")?2:1};
function slotState(pid,k){if(k==null)return "";const n=perStamp(pid);const sp=spinsOf(pid).filter(s=>!isRespin(s)).slice(k*n,(k+1)*n);
  return sp.length===n&&sp.every(s=>s.type==="sin"||s.delivered)?"canj":"due"}
function redeemCount(p,c){let ok=0,due=0;c.list.forEach((s,k)=>{slotState(p.id,k)==="canj"?ok++:due++});return {ok,due}}
function pendingFor(p,c){
  let n=0;
  MILES.forEach(m=>{if(m.ok(c)&&!(p.delivered||{})[m.k])n++});return n;
}

function cardHTML(p,c,which,big){
  const cc=which===2?c.c2:c.c1;const newest=c.list.length?c.list[c.list.length-1]:null;
  const fresh=newest&&Date.now()-Date.parse(newest.at)<8000;
  const off=which===2?6:0;
  const rows=VERTS.map(v=>`<div class="row"><span class="lbl">${v.tab}</span>${Array.from({length:6},(_,i)=>{const on=i<cc[v.k];const isNew=fresh&&on&&i===cc[v.k]-1&&newest.vertical===v.k;const st=on?slotState(p.id,c.idx[v.k][off+i]):"";return `<span class="slot${on?" on":""}${isNew?" new":""}${st?" "+st:""}">${slotSVG(v,on)}</span>`}).join("")}</div>`).join("");
  const t=which===2?c.t2:c.t1;
  return `<div class="head"><div><div class="brand">RAR Card</div><div class="nm">${esc(p.name)}</div><div class="sub">${esc([p.office,p.group].filter(Boolean).join(" · "))}</div></div><div class="rt"><img class="logo" src="${LOGO}" alt="EF Education First"><br><span class="tag">Tarjeta ${which}</span></div></div>
  <div class="rows">${rows}</div>
  <div class="foot">${(()=>{const r=redeemCount(p,c);return c.total?`<span class="fine redeem"><span class="ok">${r.ok} canjeado${r.ok===1?"":"s"}</span> · <span class="due">${r.due} por canjear</span></span>`:`<span class="fine">Booking que venga de RAR Referral-Ambassador-Returnees</span>`})()}<span class="num">${t}/18</span></div>`;
}
function visiblePeople(){
  const q=S.q.trim().toLowerCase();
  return [...S.people.values()].filter(p=>(S.office==="Todas"||p.office===S.office)&&(!q||p.name.toLowerCase().includes(q)));
}

function render(){
  // stats
  const all=[...S.people.values()];let st=0,full=0,miles=0,pend=0;
  const ranks=all.map(p=>{const c=calc(p.id);st+=c.total;full+=(c.t1>=18)+(c.t2>=18);miles+=MILES.filter(m=>m.ok(c)).length;pend+=pendingFor(p,c);return {p,c}});
  $("sPeople").textContent=all.length;$("sStamps").textContent=st;$("sCards").textContent=full;$("sMiles").textContent=miles;$("sActive").textContent=ranks.filter(r=>r.c.total>0).length;
  ranks.sort((a,b)=>b.c.total-a.c.total||a.p.name.localeCompare(b.p.name));
  $("rank").innerHTML=ranks.slice(0,5).map((r,i)=>`<li><span class="pos">${i+1}</span><span class="who">${esc(r.p.name)} <small>${esc(r.p.office)}</small></span><b>${r.c.total}</b></li>`).join("")||`<li class="note">Sin sellos todavía.</li>`;

  // segment
  $("officeSeg").innerHTML=["Todas",...OFFICES].map(o=>{const n=o==="Todas"?all.length:all.filter(p=>p.office===o).length;return `<button data-o="${o}" aria-pressed="${S.office===o}">${o} <span style="opacity:.6">${n}</span></button>`}).join("");

  // board
  const people=visiblePeople();
  if(!S.people.size){$("board").innerHTML=`<div class="empty">Todavía no hay tarjetas.</div>`;}
  else if(!people.length){$("board").innerHTML=`<div class="empty">Nadie coincide con “${esc(S.q)}”.</div>`;}
  else{
    const groups=new Map();
    people.forEach(p=>{const g=p.office+"||"+(p.group||"");if(!groups.has(g))groups.set(g,[]);groups.get(g).push(p)});
    const keys=[...groups.keys()].sort((a,b)=>{const [oa,ga]=a.split("||"),[ob,gb]=b.split("||");return OFFICES.indexOf(oa)-OFFICES.indexOf(ob)||(ga).localeCompare(gb)});
    $("board").innerHTML=keys.map(k=>{
      const [o,g]=k.split("||");const ps=groups.get(k).map(p=>({p,c:calc(p.id)}));
      ps.sort(S.sort==="name"?(a,b)=>a.p.name.localeCompare(b.p.name):(a,b)=>b.c.total-a.c.total||a.p.name.localeCompare(b.p.name));
      const tot=ps.reduce((a,x)=>a+x.c.total,0);
      return `<section class="group"><h2>${esc(o)}${g?" · "+esc(g):""}<small>${ps.length} personas · ${tot} sellos</small></h2><div class="grid">${
        ps.map(({p,c})=>`<button class="gcard" data-pid="${esc(p.id)}" aria-label="Abrir tarjeta de ${esc(p.name)}">${cardHTML(p,c,c.t1>=18?2:1)}</button>`).join("")}</div></section>`;
    }).join("");
  }
  if(S.open)renderDrawer();
}

function fmt(at){try{return new Date(at).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}catch(e){return ""}}

function renderDrawer(){
  const p=S.people.get(S.open);if(!p){closeDrawer();return}
  const c=calc(p.id);const dl=p.delivered||{};const ed=S.canEdit;
  const vname=k=>(VERTS.find(v=>v.k===k)||{l:k}).l;
  $("drawer").innerHTML=`
   <div class="dhead"><div><div class="eyebrow">${esc([p.office,p.group].filter(Boolean).join(" · "))}</div><h2 style="font-size:26px">${esc(p.name)}</h2></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
   ${ed?`<div class="panel addbox"><h3 style="margin:0">Agregar sello</h3>
     <div class="line"><input id="bkId" placeholder="Matrícula del booking, ej. MXA3578105"></div>
     <div class="line">${VERTS.map(v=>`<button class="vbtn" data-act="add" data-v="${v.k}">+ ${v.l}</button>`).join("")}</div>
     <p class="note" style="margin:0">Elige la vertical según el source: Ambassador, ExPax General (Returnee) o Referral general.</p></div>`:""}
   <div class="cards2">
     <div><div class="cap">Tarjeta 1 · ${c.t1}/18</div><div class="gcard big">${cardHTML(p,c,1)}</div></div>
     ${c.t1>=12||c.t2>0?`<div><div class="cap">Tarjeta 2 · ${c.t2}/18</div><div class="gcard big">${cardHTML(p,c,2)}</div></div>`:""}
     ${c.extra?`<p class="note">${c.extra} sello(s) extra fuera de las 2 tarjetas.</p>`:""}
   </div>
   <div><h3 style="font-size:16px;margin-bottom:8px">Premios por meta</h3><div class="miles">${MILES.map(m=>{const won=m.ok(c);
     return `<div class="mile ${won?"won":""}"><div><div>${m.l}</div><div class="req">${m.req}</div></div>${won?`<span class="pill ok">Ganado</span>`:`<span class="pill off">Bloqueado</span>`}</div>`}).join("")}</div></div>
   <div><h3 style="font-size:16px;margin-bottom:8px">Premios de ruleta</h3>
   <div class="legend"><span><i style="background:#003A63"></i>CANJEADO</span><span><i style="box-shadow:inset 0 0 0 3px #F5A524"></i>Por canjear</span><span>${perStamp(p.id)===2?"APP: 1 sello = 2 giros":"1 sello = 1 giro"}</span></div>
   <div class="hist">${(()=>{const sp=spinsOf(p.id);return sp.length?[...sp].reverse().map(s=>`<div class="hrow"><span class="ptype">Giro</span><div><div class="prize">${esc(s.prize)}</div><div class="meta">${fmt(s.at)}</div></div><div class="hact">${s.type==="sin"?"":`<span class="pill ${s.delivered?"ok":"warn"}">${s.delivered?"Canjeado":"Por canjear"}</span>`}</div></div>`).join(""):`<p class="note">Todavía no hay giros registrados.</p>`})()}</div></div>
   <div><h3 style="font-size:16px;margin-bottom:8px">Historial de sellos <span class="note">(${c.total})</span></h3>
   <div class="hist">${c.list.length?[...c.list].reverse().map(s=>{
     const dup=ed&&s.booking&&S.stamps.filter(x=>x.booking&&x.booking.toUpperCase()===s.booking.toUpperCase()).length>1;
     const conf=S.confirm===s.id;
     return `<div class="hrow"><span class="vchip">${esc(vname(s.vertical))}</span><div><div class="prize">${ed&&s.booking?esc(s.booking):"Sello"}</div><div class="meta">${fmt(s.at)} · ${esc(s.source||SRC[s.vertical]||"")}${dup?` · <span class="danger">booking repetido</span>`:""}</div></div><div class="hact">${ed?(conf?`<button class="del danger" data-act="rm" data-id="${esc(s.id)}">Quitar</button><button class="del" data-act="nocf">No</button>`:`<button class="del" data-act="cf" data-id="${esc(s.id)}" aria-label="Quitar sello">×</button>`):""}</div></div>`}).join(""):`<p class="note">Sin sellos todavía.</p>`}</div></div>
   ${ed?`<div>${S.confirm==="person"?`<span class="note">Esto borra la tarjeta y sus ${c.total} sellos. </span><button class="del danger" data-act="rmp">Sí, borrar</button> <button class="del" data-act="nocf">Cancelar</button>`:`<button class="del" data-act="cfp">Borrar tarjeta de ${esc(p.name)}</button>`}</div>`:""}`;
}

function openDrawer(pid){S.open=pid;S.confirm=null;$("scrim").hidden=false;$("drawer").hidden=false;renderDrawer();}
function closeDrawer(){S.open=null;$("scrim").hidden=true;$("drawer").hidden=true;}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}

async function addStamp(v){
  const p=S.people.get(S.open);if(!p||!S.db)return;
  const bk=($("bkId")?.value||"").trim().toUpperCase();
  if(bk&&S.stamps.some(s=>(s.booking||"").toUpperCase()===bk)){toast(`${bk} ya está registrado. Revísalo antes de sellar.`);return}
  try{
    await S.db.collection("stamps").add({pid:p.id,vertical:v,source:SRC[v],booking:bk,at:new Date().toISOString(),by:"tablero"});
    if($("bkId"))$("bkId").value="";toast(`Sello ${VERTS.find(x=>x.k===v).l} agregado a ${p.name}`);
  }catch(e){toast(e&&e.code==="invalid_argument"?"Solo quien edita el tablero puede agregar sellos.":"No se guardó el sello. Intenta de nuevo.");}
}

document.addEventListener("click",async e=>{
  const card=e.target.closest(".gcard[data-pid]");if(card){openDrawer(card.dataset.pid);return}
  const seg=e.target.closest("#officeSeg button");if(seg){S.office=seg.dataset.o;render();return}
  if(e.target===$("scrim")){closeDrawer();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,p=S.people.get(S.open);
  try{
    if(act==="close")closeDrawer();
    else if(act==="add")addStamp(b.dataset.v);
    else if(act==="mile"){const d={...(p.delivered||{})};d[b.dataset.k]=!d[b.dataset.k];await S.db.doc("participants/"+p.id).update({delivered:d});}
    else if(act==="cf"){S.confirm=b.dataset.id;renderDrawer()}
    else if(act==="cfp"){S.confirm="person";renderDrawer()}
    else if(act==="nocf"){S.confirm=null;renderDrawer()}
    else if(act==="rm"){S.confirm=null;await S.db.doc("stamps/"+b.dataset.id).delete();toast("Sello quitado")}
    else if(act==="rmp"){const ids=S.stamps.filter(s=>s.pid===p.id).map(s=>s.id);for(const id of ids)await S.db.doc("stamps/"+id).delete();await S.db.doc("participants/"+p.id).delete();S.confirm=null;closeDrawer();toast("Tarjeta borrada")}
  }catch(err){toast("No se pudo guardar el cambio.")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.open)closeDrawer()}});
$("q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("sort").addEventListener("change",e=>{S.sort=e.target.value;render()});

const slug=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"persona";
S.canEdit=false;
render();
let lastV=null;
async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw 0;const d=await r.json();
    if(d.version!==lastV){lastV=d.version;
      S.people=new Map(d.participants.map(p=>[p.id,p]));
      S.stamps=d.stamps.map((s,i)=>({id:"s"+i,...s}));S.spins=(d.spins||[]).map((s,i)=>({id:"g"+i,...s}));render();}
    const dt=new Date(d.updated);
    $("status").textContent="En vivo · actualizado "+dt.toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  }catch(e){$("status").textContent="Sin conexión. Reintentando…";}
}
load();setInterval(load,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>

</body></html>
